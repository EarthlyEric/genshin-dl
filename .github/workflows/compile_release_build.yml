name: Compile release build

on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Compile release build
        run: cargo build --release --locked

      - name: Package Linux release archive
        run: zip -j "genshin-dl-${{ github.ref_name }}-linux-x64.zip" target/release/genshin-dl LICENSE README.md CHANGELOG.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: genshin-dl-linux-x64
          path: genshin-dl-${{ github.ref_name }}-linux-x64.zip

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: genshin-dl-linux-x64
          path: release-assets

      - name: Calculate SHA256 checksums
        id: checksums
        shell: bash
        run: |
          linux_archive="release-assets/genshin-dl-${{ github.ref_name }}-linux-x64.zip"
          linux_checksum="$(sha256sum "$linux_archive")"
          printf 'linux=%s\n' "${linux_checksum%% *}" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP archives to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          append_body: true
          fail_on_unmatched_files: true
          files: |
            release-assets/genshin-dl-${{ github.ref_name }}-linux-x64.zip
          body: |
            ---

            ### Downloads

            - [Download genshin-dl (${{ github.ref_name }}, Linux x64)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/genshin-dl-${{ github.ref_name }}-linux-x64.zip)
            - `genshin-dl-${{ github.ref_name }}-linux-x64.zip`: `${{ steps.checksums.outputs.linux }}`
